<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gate Scanner</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0;
           padding: 12px; max-width: 500px; margin: 0 auto; background: #fafafa; }
    h1 { font-size: 1.1rem; margin: 0 0 8px; }
    .muted { color: #666; font-size: 0.85rem; margin: 4px 0 12px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden;
              background: #111; min-height: 260px; display: flex;
              align-items: center; justify-content: center; color: #ccc;
              font-size: 0.9rem; text-align: center; padding: 12px; }
    #startBtn { display: block; width: 100%; padding: 14px; margin: 12px 0;
                font-size: 1.1rem; border: 0; border-radius: 8px;
                background: #198754; color: white; cursor: pointer; font-weight: 600; }
    #startBtn:disabled { background: #6c757d; }
    #result { margin-top: 14px; padding: 20px; border-radius: 10px; text-align: center;
              display: none; }
    #result strong { display: block; font-size: 1.6rem; margin-bottom: 6px; }
    #result .sub { font-size: 1rem; margin: 2px 0; }
    #result .id { font-size: 0.8rem; opacity: 0.7; margin-top: 6px;
                  font-family: ui-monospace, monospace; word-break: break-all; }
    .approved { background: #d1e7dd; color: #0a3622; border: 3px solid #198754; }
    .used     { background: #f8d7da; color: #58151c; border: 3px solid #dc3545; }
    .invalid  { background: #f8d7da; color: #58151c; border: 3px solid #dc3545; }
    .error    { background: #fff3cd; color: #664d03; border: 3px solid #ffc107; }
    .fallback { margin-top: 12px; display: flex; gap: 6px; }
    .fallback input { flex: 1; padding: 10px; font-size: 1rem;
                      border: 1px solid #bbb; border-radius: 6px; }
    .fallback button { padding: 10px 16px; font-size: 1rem; border: 0;
                       background: #0d6efd; color: white; border-radius: 6px; cursor: pointer; }
    #diag { font-size: 0.75rem; color: #333; background: #eee; padding: 8px;
            border-radius: 6px; margin-top: 8px; font-family: ui-monospace, monospace;
            white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; }
    .config-warn { background: #fff3cd; color: #664d03; padding: 8px 12px;
                   border-radius: 6px; font-size: 0.85rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Gate scanner</h1>
  <p class="muted">Tap Start, allow camera, then point at the ticket QR.</p>

  <div id="config-warn" class="config-warn" hidden>
    ⚠️ API_URL not set. Edit this HTML file and paste your Apps Script Web App URL.
  </div>

  <button id="startBtn" onclick="startCamera()">▶ Start Camera</button>

  <div id="reader">Camera off — tap "Start Camera" above.</div>

  <div class="fallback">
    <input id="manualId" placeholder="Or type ticket ID (e.g. TKT-XXXX)" autocomplete="off" />
    <button onclick="manualValidate()">Check</button>
  </div>

  <div id="result"></div>
  <div id="diag">[boot] page loaded</div>

<script>
  // ------------------------------------------------------------------
  // EDIT: paste the Apps Script Web App URL between the quotes.
  // ------------------------------------------------------------------
  const API_URL = 'https://script.google.com/a/macros/spjimr.org/s/AKfycbzV4paEZnPW3oqtnTUB3XT-MNF_Ka-Zw0KF3ObmHbZoq8VG-rjuoAJR4Ybl86DLbBgM/exec';

  const diagEl = document.getElementById('diag');
  const resultEl = document.getElementById('result');
  const readerEl = document.getElementById('reader');
  const startBtn = document.getElementById('startBtn');
  const configWarn = document.getElementById('config-warn');
  let busy = false;
  let lastId = null;
  let lastTs = 0;
  let scanner = null;

  function log(msg) {
    diagEl.textContent += '\n' + new Date().toTimeString().slice(0, 8) + ' ' + msg;
    diagEl.scrollTop = diagEl.scrollHeight;
  }

  if (!API_URL || API_URL === 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
    configWarn.hidden = false;
    log('WARN: API_URL not set — edit HTML');
  }

  // Try to load html5-qrcode from a chain of CDNs.
  const CDN_URLS = [
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.10/html5-qrcode.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.10/html5-qrcode.min.js',
    'https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js',
  ];

  function loadLibrary(i) {
    if (i >= CDN_URLS.length) {
      log('ERROR: all CDNs failed. Camera scan unavailable — use manual field.');
      return;
    }
    log('loading library from CDN ' + (i + 1) + '…');
    const s = document.createElement('script');
    s.src = CDN_URLS[i];
    s.onload = () => log('library loaded (Html5Qrcode ready)');
    s.onerror = () => { log('CDN ' + (i + 1) + ' failed'); loadLibrary(i + 1); };
    document.head.appendChild(s);
  }
  loadLibrary(0);

  function showResult(res, ticketId) {
    resultEl.style.display = 'block';
    resultEl.className = res.status;
    let html = '<strong>' + res.message + '</strong>';
    if (res.name)   html += '<div class="sub">Name: ' + res.name + '</div>';
    if (res.usedAt) html += '<div class="sub">Time: ' + res.usedAt + '</div>';
    html += '<div class="id">' + ticketId + '</div>';
    resultEl.innerHTML = html;
    try {
      navigator.vibrate && navigator.vibrate(res.status === 'approved' ? 150 : [100,80,100,80,100]);
    } catch(_){}
    setTimeout(() => { resultEl.style.display = 'none'; busy = false; }, 4500);
  }

  async function validate(ticketId) {
    if (busy) return;
    busy = true;
    log('validate ' + ticketId);
    try {
      const res = await fetch(API_URL + '?ticket=' + encodeURIComponent(ticketId), {
        method: 'GET', redirect: 'follow',
      });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (_) {
        log('bad JSON from API: ' + text.slice(0, 120));
        showResult({ status:'error', message:'API returned non-JSON (auth wall?)' }, ticketId);
        return;
      }
      showResult(json, ticketId);
    } catch (err) {
      log('fetch failed: ' + err);
      showResult({ status:'error', message:'Network error: ' + err }, ticketId);
    }
  }

  function manualValidate() {
    const id = document.getElementById('manualId').value.trim();
    if (id) { validate(id); document.getElementById('manualId').value = ''; }
  }
  document.getElementById('manualId').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualValidate();
  });

  function onScan(decodedText) {
    const now = Date.now();
    if (decodedText === lastId && (now - lastTs) < 4500) return;
    lastId = decodedText;
    lastTs = now;
    validate(decodedText.trim());
  }

  async function startCamera() {
    if (!window.Html5Qrcode) {
      log('library not loaded yet, retrying in 1s…');
      setTimeout(startCamera, 1000);
      return;
    }
    startBtn.disabled = true;
    startBtn.textContent = 'Starting…';
    readerEl.textContent = '';
    try {
      // First: get camera permission via a direct navigator.mediaDevices call.
      // Some Android browsers won't prompt when html5-qrcode calls getUserMedia
      // indirectly. Doing it here as a user-gesture-driven call is more reliable.
      log('requesting camera permission…');
      const testStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }, audio: false
      });
      testStream.getTracks().forEach(t => t.stop());
      log('permission granted');

      scanner = new Html5Qrcode('reader');
      const cameras = await Html5Qrcode.getCameras();
      log('cameras found: ' + cameras.length);
      if (!cameras.length) throw new Error('No cameras');
      const camId = cameras[cameras.length - 1].id;
      await scanner.start(camId, { fps: 10, qrbox: { width: 260, height: 260 } }, onScan, () => {});
      log('scanner started (cam id ' + camId.slice(-8) + ')');
      startBtn.textContent = '⏸ Stop';
      startBtn.disabled = false;
      startBtn.onclick = stopCamera;
    } catch (err) {
      log('camera error: ' + (err && err.message || err));
      readerEl.textContent = 'Camera failed: ' + (err && err.message || err) + '. Use manual field below.';
      startBtn.textContent = '▶ Retry Start Camera';
      startBtn.disabled = false;
    }
  }

  async function stopCamera() {
    try { await scanner.stop(); } catch (_) {}
    readerEl.textContent = 'Camera stopped.';
    startBtn.textContent = '▶ Start Camera';
    startBtn.onclick = startCamera;
  }
</script>
</body>
</html>
