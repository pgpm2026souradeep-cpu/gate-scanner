<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gate Scanner</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0;
           padding: 12px; max-width: 500px; margin: 0 auto; background: #fafafa; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    .muted { color: #666; font-size: 0.85rem; margin: 4px 0 12px; }
    #video-wrap { width: 100%; background: #111; border-radius: 8px;
                  overflow: hidden; min-height: 260px; position: relative;
                  display: flex; align-items: center; justify-content: center; }
    #video { width: 100%; height: 100%; max-height: 400px; object-fit: cover; display: block; }
    #video-msg { color: #ccc; padding: 20px; text-align: center; font-size: 0.9rem; }
    #startBtn { display: block; width: 100%; padding: 14px; margin: 10px 0;
                font-size: 1.05rem; border: 0; border-radius: 8px;
                background: #198754; color: white; cursor: pointer; font-weight: 600; }
    #startBtn:disabled { background: #6c757d; }
    #result { margin-top: 14px; padding: 20px; border-radius: 10px; text-align: center;
              display: none; }
    #result strong { display: block; font-size: 1.6rem; margin-bottom: 6px; }
    #result .sub { font-size: 1rem; margin: 2px 0; }
    #result .id { font-size: 0.8rem; opacity: 0.7; margin-top: 6px;
                  font-family: ui-monospace, monospace; word-break: break-all; }
    .approved { background: #d1e7dd; color: #0a3622; border: 3px solid #198754; }
    .used     { background: #f8d7da; color: #58151c; border: 3px solid #dc3545; }
    .invalid  { background: #f8d7da; color: #58151c; border: 3px solid #dc3545; }
    .error    { background: #fff3cd; color: #664d03; border: 3px solid #ffc107; }
    .fallback { margin-top: 12px; display: flex; gap: 6px; }
    .fallback input { flex: 1; padding: 10px; font-size: 1rem;
                      border: 1px solid #bbb; border-radius: 6px; }
    .fallback button { padding: 10px 16px; font-size: 1rem; border: 0;
                       background: #0d6efd; color: white; border-radius: 6px; cursor: pointer; }
    #setup { background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px;
             padding: 12px; margin-bottom: 12px; }
    #setup h3 { margin: 0 0 6px; font-size: 1rem; }
    #setup input { width: 100%; padding: 10px; font-size: 0.9rem; margin: 6px 0;
                   border: 1px solid #bbb; border-radius: 6px; }
    #setup button { padding: 10px 16px; font-size: 1rem; border: 0;
                    background: #0d6efd; color: white; border-radius: 6px; cursor: pointer; }
    #diag { font-size: 0.72rem; color: #333; background: #eee; padding: 8px;
            border-radius: 6px; margin-top: 8px; font-family: ui-monospace, monospace;
            white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow: auto; }
    .row { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;
           margin-top: 6px; color: #666; }
    .row a { color: #0d6efd; text-decoration: none; }
  </style>
</head>
<body>

  <h1>Gate scanner</h1>
  <p class="muted">Tap Start, allow camera, then point at the ticket QR.</p>

  <div id="setup" hidden>
    <h3>One-time setup</h3>
    <div>Paste your Apps Script Web App URL (from Deploy → Manage deployments in Apps Script):</div>
    <input id="apiUrlInput" placeholder="https://script.google.com/a/macros/spjimr.org/s/.../exec" />
    <button onclick="saveApiUrl()">Save</button>
  </div>

  <div id="main" hidden>
    <button id="startBtn" onclick="startCamera()">▶ Start Camera</button>

    <div id="video-wrap">
      <div id="video-msg">Camera off — tap "Start Camera" above.</div>
      <video id="video" playsinline autoplay muted hidden></video>
    </div>

    <div class="fallback">
      <input id="manualId" placeholder="Or type ticket ID (e.g. TKT-XXXX)" autocomplete="off" />
      <button onclick="manualValidate()">Check</button>
    </div>

    <div id="result"></div>
    <div id="diag">[boot] ready</div>
    <div class="row">
      <span id="apiHint"></span>
      <a href="#" onclick="resetApiUrl(); return false;">Change API URL</a>
    </div>
  </div>

<script>
  // Hardcoded default API URL — used if localStorage is empty.
  // Change this here and re-commit if the URL ever changes.
  const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwwjrIuK7BLmEU_byRTg9C0PsWATBnbPRtOMvaYtklwMecaXE9aWWYP8Ou_d8lvbzMm/exec';

  const LS_KEY = 'gate_api_url';
  let API_URL = localStorage.getItem(LS_KEY) || DEFAULT_API_URL;

  const setupEl = document.getElementById('setup');
  const mainEl = document.getElementById('main');
  const videoEl = document.getElementById('video');
  const videoMsg = document.getElementById('video-msg');
  const startBtn = document.getElementById('startBtn');
  const diagEl = document.getElementById('diag');
  const resultEl = document.getElementById('result');
  const apiHint = document.getElementById('apiHint');

  function log(msg) {
    diagEl.textContent += '\n' + new Date().toTimeString().slice(0, 8) + ' ' + msg;
    diagEl.scrollTop = diagEl.scrollHeight;
  }

  function showSetup() {
    setupEl.hidden = false;
    mainEl.hidden = true;
    if (API_URL) document.getElementById('apiUrlInput').value = API_URL;
  }
  function showMain() {
    setupEl.hidden = true;
    mainEl.hidden = false;
    apiHint.textContent = 'API: ' + (API_URL.slice(0, 60)) + (API_URL.length > 60 ? '…' : '');
    log('BarcodeDetector: ' + ('BarcodeDetector' in window ? 'available (native)' : 'NOT available — will need manual entry'));
    log('camera: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'API available' : 'NOT available'));
  }
  function saveApiUrl() {
    const v = document.getElementById('apiUrlInput').value.trim();
    if (!v) return alert('Paste the URL first.');
    if (!v.startsWith('https://')) return alert('Must start with https://');
    localStorage.setItem(LS_KEY, v);
    API_URL = v;
    showMain();
  }
  function resetApiUrl() { showSetup(); }

  if (!API_URL) showSetup(); else showMain();

  // ---------- validation ----------
  let busy = false;
  let lastId = null;
  let lastTs = 0;

  function showResult(res, ticketId) {
    resultEl.style.display = 'block';
    resultEl.className = res.status;
    let html = '<strong>' + res.message + '</strong>';
    if (res.name)   html += '<div class="sub">Name: ' + res.name + '</div>';
    if (res.usedAt) html += '<div class="sub">Time: ' + res.usedAt + '</div>';
    html += '<div class="id">' + ticketId + '</div>';
    resultEl.innerHTML = html;
    try {
      navigator.vibrate && navigator.vibrate(res.status === 'approved' ? 150 : [100,80,100,80,100]);
    } catch(_){}
    setTimeout(() => { resultEl.style.display = 'none'; busy = false; }, 4500);
  }

  async function validate(ticketId) {
    if (busy) return;
    busy = true;
    log('validate ' + ticketId);
    try {
      const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + 'ticket=' + encodeURIComponent(ticketId),
                              { method: 'GET', redirect: 'follow' });
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (_) {
        log('non-JSON response: ' + text.slice(0, 120));
        showResult({ status:'error', message:'API returned non-JSON (auth wall?)' }, ticketId);
        return;
      }
      log('result: ' + json.status);
      showResult(json, ticketId);
    } catch (err) {
      log('fetch failed: ' + err);
      showResult({ status:'error', message:'Network error: ' + err }, ticketId);
    }
  }

  function manualValidate() {
    const id = document.getElementById('manualId').value.trim();
    if (id) { validate(id); document.getElementById('manualId').value = ''; }
  }
  document.getElementById('manualId').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualValidate();
  });

  function onScan(decodedText) {
    const now = Date.now();
    if (decodedText === lastId && (now - lastTs) < 4500) return;
    lastId = decodedText;
    lastTs = now;
    validate(decodedText.trim());
  }

  // ---------- camera + native BarcodeDetector ----------
  let scanning = false;
  let detector = null;

  async function startCamera() {
    startBtn.disabled = true;
    startBtn.textContent = 'Starting…';
    videoMsg.textContent = '';
    try {
      log('requesting camera…');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      videoEl.srcObject = stream;
      videoEl.hidden = false;
      videoMsg.style.display = 'none';
      await videoEl.play();
      log('camera stream live');

      if ('BarcodeDetector' in window) {
        try {
          detector = new BarcodeDetector({ formats: ['qr_code'] });
          log('BarcodeDetector ready — starting scan loop');
          scanning = true;
          scanLoop();
        } catch (e) {
          log('BarcodeDetector init failed: ' + e);
          videoMsg.textContent = 'Auto-scan unavailable on this browser. Show QR, then type its ID into the field below.';
          videoMsg.style.display = 'block';
        }
      } else {
        log('BarcodeDetector NOT in browser — camera on but no auto-scan. Use manual field.');
        videoMsg.textContent = 'Camera on but auto-scan unavailable on this browser. Use the manual field below to type the ticket ID.';
        videoMsg.style.color = '#fff';
        videoMsg.style.position = 'absolute';
        videoMsg.style.top = '10px';
        videoMsg.style.left = '10px';
        videoMsg.style.right = '10px';
        videoMsg.style.background = 'rgba(0,0,0,0.6)';
        videoMsg.style.padding = '8px';
        videoMsg.style.borderRadius = '4px';
        videoMsg.style.display = 'block';
      }

      startBtn.textContent = '⏸ Stop';
      startBtn.disabled = false;
      startBtn.onclick = stopCamera;
    } catch (err) {
      log('camera error: ' + (err && err.message || err));
      videoMsg.textContent = 'Camera failed: ' + (err && err.message || err) + '. Use manual field below.';
      videoMsg.style.display = 'block';
      startBtn.textContent = '▶ Retry';
      startBtn.disabled = false;
    }
  }

  async function scanLoop() {
    if (!scanning) return;
    try {
      const codes = await detector.detect(videoEl);
      if (codes && codes.length > 0) {
        onScan(codes[0].rawValue);
      }
    } catch (_) {}
    setTimeout(scanLoop, 250);   // ~4 scans/sec
  }

  function stopCamera() {
    scanning = false;
    if (videoEl.srcObject) {
      videoEl.srcObject.getTracks().forEach(t => t.stop());
      videoEl.srcObject = null;
    }
    videoEl.hidden = true;
    videoMsg.textContent = 'Camera stopped.';
    videoMsg.style.display = 'block';
    startBtn.textContent = '▶ Start Camera';
    startBtn.onclick = startCamera;
  }
</script>
</body>
</html>
